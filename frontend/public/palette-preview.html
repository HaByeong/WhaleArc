<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WhaleArc · virt 다크모드 색조 비교</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif;
         background: #0a0e14; color: #cbd5e1; padding: 24px 16px 80px; }
  h1 { font-size: 20px; color: #e2e8f0; margin-bottom: 4px; text-align: center; }
  .sub { font-size: 13px; color: #64748b; text-align: center; margin-bottom: 28px; }
  .wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
  .block { border-radius: 16px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
  .label { display: flex; align-items: baseline; gap: 10px; padding: 10px 14px; background: #11161f; font-size: 13px; }
  .label .name { font-weight: 700; color: #f1f5f9; font-size: 15px; }
  .label .hex { color: #64748b; font-family: ui-monospace, monospace; font-size: 11px; }
  .label .pick { margin-left: auto; color: #38bdf8; font-weight: 600; }
  .mock { padding: 0; }
  .hd { display: flex; align-items: center; gap: 14px; padding: 12px 16px; }
  .hd .logo { font-weight: 800; letter-spacing: .5px; font-size: 14px; }
  .hd .nav { font-size: 12px; display: flex; gap: 12px; }
  .hd .icons { margin-left: auto; font-size: 13px; }
  .banner { margin: 12px 16px; border-radius: 14px; padding: 18px 20px; color: #fff;
            display: flex; justify-content: space-between; align-items: center; }
  .banner .t1 { font-size: 16px; font-weight: 800; }
  .banner .t2 { font-size: 11px; opacity: .85; margin-top: 2px; }
  .banner .amt { font-size: 18px; font-weight: 800; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 4px 16px; }
  .card { border-radius: 12px; padding: 14px; }
  .card .k { font-size: 11px; margin-bottom: 4px; }
  .card .v { font-size: 16px; font-weight: 800; }
  .onb { margin: 12px 16px 16px; border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
  .onb .ic { width: 34px; height: 34px; border-radius: 9px; flex: none; }
  .onb .ti { font-size: 13px; font-weight: 700; }
  .onb .de { font-size: 11px; margin-top: 1px; }
  .btn { display: inline-block; margin: 0 16px 16px; padding: 9px 16px; border-radius: 9px;
         font-size: 13px; font-weight: 700; }
</style>
</head>
<body>
  <h1>virt 다크모드 색조 비교</h1>
  <div class="sub">초보자(virt) 섹션의 다크모드 후보입니다. 마음에 드는 번호를 알려주세요.</div>
  <div class="wrap" id="wrap"></div>

<script>
const palettes = [
  { name: "① 현재 · 파란 슬레이트", hex: "#1f3050",
    page:"#1f3050", border:"rgba(255,255,255,.12)", card:"rgba(255,255,255,.06)",
    text:"#f0f6fc", sec:"#a8bdd6", muted:"#7e97b3", accent:"#56c5f5",
    bf:"#0284c7", bt:"#0ea5e9" },
  { name: "② 뉴트럴 차콜", hex: "#1c2027 · 무채색+시안 포인트",
    page:"#1c2027", border:"rgba(255,255,255,.10)", card:"rgba(255,255,255,.05)",
    text:"#e9ebef", sec:"#a3a9b3", muted:"#6f7681", accent:"#38bdf8",
    bf:"#0369a1", bt:"#0891b2" },
  { name: "③ 소프트 디밍 · 밝은 다크", hex: "#2b3344",
    page:"#2b3344", border:"rgba(255,255,255,.12)", card:"rgba(255,255,255,.07)",
    text:"#f1f5f9", sec:"#b3c0d4", muted:"#8294ab", accent:"#56c5f5",
    bf:"#0ea5e9", bt:"#38bdf8" },
  { name: "④ 웜 그레이", hex: "#26242a · 따뜻한 회색",
    page:"#26242a", border:"rgba(255,255,255,.10)", card:"rgba(255,255,255,.05)",
    text:"#ece8e6", sec:"#b0a8a8", muted:"#807676", accent:"#38bdf8",
    bf:"#0369a1", bt:"#0891b2" },
  { name: "⑤ 딥 틸 · 청록 바다", hex: "#14272b",
    page:"#14272b", border:"rgba(255,255,255,.10)", card:"rgba(255,255,255,.055)",
    text:"#e6f2f1", sec:"#93b3b1", muted:"#6d8b89", accent:"#2dd4bf",
    bf:"#0d9488", bt:"#0891b2" },
];

const wrap = document.getElementById('wrap');
palettes.forEach(p => {
  wrap.insertAdjacentHTML('beforeend', `
    <div class="block">
      <div class="label"><span class="name">${p.name}</span><span class="hex">${p.hex}</span><span class="pick">← 이거?</span></div>
      <div class="mock" style="background:${p.page}">
        <div class="hd" style="border-bottom:1px solid ${p.border}">
          <span class="logo" style="color:${p.accent}">WHALEARC-VIRT</span>
          <span class="nav" style="color:${p.sec}"><span>내 투자</span><span>시세</span><span>거래</span><span>전략</span></span>
          <span class="icons" style="color:${p.sec}">🌙 🔔 김병하</span>
        </div>
        <div class="banner" style="background:linear-gradient(135deg, ${p.bf}, ${p.bt})">
          <div><div class="t1">김병하님, 다시 바다에 오셨군요!</div><div class="t2">오늘도 시장의 바다를 유영해볼까요?</div></div>
          <div style="text-align:right"><div class="t2">총 자산</div><div class="amt">₩10,000,000</div></div>
        </div>
        <div class="cards">
          <div class="card" style="background:${p.card};border:1px solid ${p.border}"><div class="k" style="color:${p.sec}">총 자산</div><div class="v" style="color:${p.text}">₩10,000,000</div></div>
          <div class="card" style="background:${p.card};border:1px solid ${p.border}"><div class="k" style="color:${p.sec}">현금</div><div class="v" style="color:${p.text}">₩10,000,000</div></div>
          <div class="card" style="background:${p.card};border:1px solid ${p.border}"><div class="k" style="color:${p.sec}">수익률</div><div class="v" style="color:#f87171">▲ +0.00%</div></div>
        </div>
        <div class="onb" style="background:${p.card};border:1px solid ${p.border}">
          <div class="ic" style="background:rgba(56,189,248,.15)"></div>
          <div><div class="ti" style="color:${p.text}">삼성전자 1주 사보기</div><div class="de" style="color:${p.muted}">국내 대표 주식으로 첫 매수 체험</div></div>
        </div>
        <span class="btn" style="background:${p.accent};color:#04121f">거래하기</span>
      </div>
    </div>
  `);
});
</script>
</body>
</html>
