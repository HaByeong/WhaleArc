<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>WhaleArc · 전략 학습</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="icon" type="image/png" href="brand-whale.png">
<meta name="theme-color" content="#060b1f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0: #060b1f;
    --bg-1: #0a1230;
    --bg-2: #0e1a3d;
    --ink-0: #ffffff;
    --ink-1: rgba(255,255,255,.72);
    --ink-2: rgba(255,255,255,.48);
    --ink-3: rgba(255,255,255,.28);
    --line: rgba(255,255,255,.10);
    --line-strong: rgba(255,255,255,.18);
    --accent: #2c6fe6;
    --accent-glow: #5b9dff;
    --up: #ef4d4d;
    --down: #4d8aff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg-0); color: var(--ink-0);
    font-family: 'Noto Sans KR', 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  ::selection { background: var(--accent); color: #fff; }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: .55; transform: scale(.9); }
  }
  @keyframes whale-float {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50%      { transform: translateY(-8px) rotate(1deg); }
  }
  @keyframes message-in {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes modal-in {
    from { opacity: 0; transform: scale(.96); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes backdrop-in {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-feature-settings: 'tnum'; }
  a { text-decoration: none; color: inherit; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }
  h1, h2, h3 { word-break: keep-all; overflow-wrap: anywhere; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="dashboard.jsx"></script>
<script type="text/babel" src="market-parts.jsx"></script>
<script type="text/babel" src="learn-data.jsx"></script>
<script type="text/babel" src="learn-modal.jsx"></script>
<script type="text/babel" src="learn-app.jsx"></script>
</head>

</body>
</html>
