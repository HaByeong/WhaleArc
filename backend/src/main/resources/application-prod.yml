server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:${spring.data.mongodb.uri:mongodb://localhost:27017/whaleArc}}

# 프로덕션 CORS — 실제 도메인만 허용
# CORS_ALLOWED_ORIGINS는 prod에서 사실상 필수. 아래 기본값은 최소 폴백이며,
# api/www 등 추가 진입 도메인이 있으면 prod.env에 모두 명시할 것(예: https://whale-arc.com,https://api.whale-arc.com). DEPLOYMENT.md 참고
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://whale-arc.com}

# Actuator — 헬스체크 + 메트릭
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: WARN
    org.springframework: WARN
    org.springframework.security: WARN
    com.project.whalearc: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 실계좌 연동 암호화 키 (필수)
virt:
  encryption-key: ${VIRT_ENCRYPTION_KEY}

# 거래소 실계좌 자격증명 암호화 키 (필수)
exchange:
  encryption-key: ${EXCHANGE_ENCRYPTION_KEY}

# 감정 거울 — 운영은 7일(10080분) 타임캡슐
mirror:
  reveal-minutes: ${MIRROR_REVEAL_MINUTES:10080}
