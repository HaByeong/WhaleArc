<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WhaleArc · virt 다크 색 튜너</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif;
         background: #0a0e14; color: #cbd5e1; padding-bottom: 60px; }

  /* 컨트롤 패널 */
  .panel { position: sticky; top: 0; z-index: 10; background: #0d1219; border-bottom: 1px solid #1e293b;
           padding: 14px 16px; }
  .panel h1 { font-size: 15px; color: #e2e8f0; margin-bottom: 10px; }
  .ctrls { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
  .ctrl { display: flex; flex-direction: column; gap: 4px; }
  .ctrl label { font-size: 11px; color: #64748b; }
  .ctrl .row { display: flex; align-items: center; gap: 6px; }
  input[type=color] { width: 42px; height: 30px; border: 1px solid #334155; border-radius: 6px; background: none; cursor: pointer; padding: 2px; }
  input[type=text] { width: 84px; background: #111827; border: 1px solid #334155; color: #e2e8f0;
                     border-radius: 6px; padding: 5px 7px; font-family: ui-monospace, monospace; font-size: 12px; }
  .presets { margin-top: 10px; }
  .presets .lbl { font-size: 11px; color: #64748b; margin-bottom: 5px; }
  .sw { display: inline-block; width: 30px; height: 24px; border-radius: 5px; margin: 0 5px 5px 0;
        border: 1px solid rgba(255,255,255,.15); cursor: pointer; vertical-align: middle; }
  .readout { margin-top: 10px; padding: 9px 12px; background: #111827; border: 1px solid #1e3a5f;
             border-radius: 8px; font-family: ui-monospace, monospace; font-size: 12px; color: #7dd3fc; }
  .readout b { color: #e2e8f0; }

  /* 미니 대시보드 mock */
  .stage { padding: 22px 16px; }
  .mock { max-width: 880px; margin: 0 auto; border-radius: 16px; overflow: hidden;
          background: var(--bg); box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .hd { display: flex; align-items: center; gap: 16px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
  .hd .logo { font-weight: 800; letter-spacing: .5px; font-size: 15px; color: var(--accent); }
  .hd .nav { font-size: 12px; display: flex; gap: 14px; color: var(--sec); }
  .hd .icons { margin-left: auto; font-size: 13px; color: var(--sec); }
  .banner { margin: 14px 18px; border-radius: 14px; padding: 20px 22px; color: #fff;
            background: linear-gradient(135deg, var(--bfrom), var(--bto));
            display: flex; justify-content: space-between; align-items: center; }
  .banner .t1 { font-size: 17px; font-weight: 800; }
  .banner .t2 { font-size: 11px; opacity: .85; margin-top: 3px; }
  .banner .amt { font-size: 19px; font-weight: 800; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 4px 18px; }
  .card { border-radius: 12px; padding: 16px; background: var(--card); border: 1px solid var(--border); }
  .card .k { font-size: 11px; color: var(--sec); margin-bottom: 5px; }
  .card .v { font-size: 17px; font-weight: 800; color: var(--text); }
  .onb { margin: 14px 18px; border-radius: 12px; padding: 13px 15px; background: var(--card);
         border: 1px solid var(--border); display: flex; align-items: center; gap: 11px; }
  .onb .ic { width: 36px; height: 36px; border-radius: 9px; background: rgba(56,189,248,.15); flex: none; }
  .onb .ti { font-size: 13px; font-weight: 700; color: var(--text); }
  .onb .de { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .btn { display: inline-block; margin: 4px 18px 18px; padding: 10px 18px; border-radius: 9px;
         font-size: 13px; font-weight: 700; background: var(--accent); color: #04121f; }
</style>
</head>
<body>
  <div class="panel">
    <h1>🎚️ virt 다크모드 색 튜너 — 마음에 드는 값 나오면 hex를 알려주세요</h1>
    <div class="ctrls">
      <div class="ctrl"><label>배경</label><div class="row"><input type="color" id="bg" value="#143042"><input type="text" id="bgT" value="#143042"></div></div>
      <div class="ctrl"><label>배너 시작</label><div class="row"><input type="color" id="bf" value="#0369a1"><input type="text" id="bfT" value="#0369a1"></div></div>
      <div class="ctrl"><label>배너 끝</label><div class="row"><input type="color" id="bt" value="#0891b2"><input type="text" id="btT" value="#0891b2"></div></div>
      <div class="ctrl"><label>액센트</label><div class="row"><input type="color" id="ac" value="#38bdf8"><input type="text" id="acT" value="#38bdf8"></div></div>
    </div>
    <div class="presets">
      <div class="lbl">배경 프리셋 (클릭하면 적용 · 지금까지 시도한 것 포함):</div>
      <div id="swatches"></div>
    </div>
    <div class="readout" id="readout"></div>
  </div>

  <div class="stage">
    <div class="mock" id="mock">
      <div class="hd">
        <span class="logo">WHALEARC-VIRT</span>
        <span class="nav"><span>내 투자</span><span>시세</span><span>거래</span><span>전략</span></span>
        <span class="icons">🌙 🔔 김병하</span>
      </div>
      <div class="banner">
        <div><div class="t1">김병하님, 다시 바다에 오셨군요!</div><div class="t2">오늘도 시장의 바다를 유영해볼까요?</div></div>
        <div style="text-align:right"><div class="t2">총 자산</div><div class="amt">₩10,000,000</div></div>
      </div>
      <div class="cards">
        <div class="card"><div class="k">총 자산</div><div class="v">₩10,000,000</div></div>
        <div class="card"><div class="k">현금</div><div class="v">₩10,000,000</div></div>
        <div class="card"><div class="k">수익률</div><div class="v" style="color:#f87171">▲ +0.00%</div></div>
      </div>
      <div class="onb">
        <div class="ic"></div>
        <div><div class="ti">삼성전자 1주 사보기</div><div class="de">국내 대표 주식으로 첫 매수 체험</div></div>
      </div>
      <span class="btn">거래하기</span>
    </div>
  </div>

<script>
const presets = [
  "#0f1b2d","#143042","#16384f","#1a3a52","#0e2433","#13283a","#1a2740","#15202b",
  "#102a30","#1c2027","#1f3050","#0a1726"
];
const mock = document.getElementById('mock');
const readout = document.getElementById('readout');

function setVar(name, val){ mock.style.setProperty(name, val); }
function apply(){
  const bg = document.getElementById('bg').value;
  const bf = document.getElementById('bf').value;
  const bt = document.getElementById('bt').value;
  const ac = document.getElementById('ac').value;
  setVar('--bg', bg);
  setVar('--bfrom', bf); setVar('--bto', bt); setVar('--accent', ac);
  // 카드/텍스트/테두리는 자동
  setVar('--card', 'rgba(255,255,255,0.05)');
  setVar('--border', 'rgba(255,255,255,0.09)');
  setVar('--text', '#e7eff6');
  setVar('--sec', '#9db3c5');
  setVar('--muted', '#6a8298');
  document.getElementById('bgT').value = bg;
  document.getElementById('bfT').value = bf;
  document.getElementById('btT').value = bt;
  document.getElementById('acT').value = ac;
  readout.innerHTML = `📋 이 값을 알려주세요 → <b>배경 ${bg}</b> · 배너 ${bf}→${bt} · 액센트 ${ac}`;
}
function bindPair(colorId, textId){
  const c = document.getElementById(colorId), t = document.getElementById(textId);
  c.addEventListener('input', apply);
  t.addEventListener('change', () => { if(/^#[0-9a-fA-F]{6}$/.test(t.value)){ c.value = t.value; apply(); } });
}
['bg','bf','bt','ac'].forEach(id => bindPair(id, id+'T'));

const sw = document.getElementById('swatches');
presets.forEach(c => {
  const el = document.createElement('span');
  el.className = 'sw'; el.style.background = c; el.title = c;
  el.onclick = () => { document.getElementById('bg').value = c; apply(); };
  sw.appendChild(el);
});

apply();
</script>
</body>
</html>
