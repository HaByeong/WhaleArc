<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>WhaleArc · 시장을 유영하듯</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="icon" type="image/png" href="brand-whale.png">
<meta name="theme-color" content="#060b1f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0: #060b1f;
    --bg-1: #0a1230;
    --bg-2: #0e1a3d;
    --ink-0: #ffffff;
    --ink-1: rgba(255,255,255,.72);
    --ink-2: rgba(255,255,255,.48);
    --ink-3: rgba(255,255,255,.28);
    --line: rgba(255,255,255,.10);
    --line-strong: rgba(255,255,255,.18);
    --accent: #2c6fe6;
    --accent-glow: #5b9dff;
    --up: #ef4d4d;
    --down: #4d8aff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg-0);
    color: var(--ink-0);
    font-family: 'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  ::selection { background: var(--accent); color: #fff; }

  /* whale float animation */
  @keyframes whale-float {
    0%, 100% { transform: translateY(0) rotate(-1.2deg); }
    50%      { transform: translateY(-22px) rotate(1.2deg); }
  }
  @keyframes whale-float-slow {
    0%, 100% { transform: translate(0,0) rotate(-1deg); }
    50%      { transform: translate(-10px,-14px) rotate(1deg); }
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: .55; transform: scale(.9); }
  }
  @keyframes ticker-scroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  @keyframes spark {
    0%   { stroke-dashoffset: 240; }
    100% { stroke-dashoffset: 0; }
  }

  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-feature-settings: 'tnum'; }

  /* polish-pass */
  *:focus-visible{ outline:2px solid var(--sonar, var(--accent)); outline-offset:2px; border-radius:4px; }
  button, a { -webkit-tap-highlight-color:transparent; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.12); border-radius:8px; border:2px solid transparent; background-clip:content-box; }
  ::-webkit-scrollbar-thumb:hover{ background:rgba(255,255,255,.22); background-clip:content-box; }
  ::-webkit-scrollbar-track{ background:transparent; }
  html{ scroll-behavior:smooth; }

  /* whalearc-fx */
  .whalearc-text{ background:linear-gradient(90deg,#fff 0%,#a8d4ff 25%,#4a90e2 50%,#a8d4ff 75%,#fff 100%);
    background-size:300% 100%; -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent;
    animation:whalearc-shine 5s linear infinite; filter:drop-shadow(0 0 8px rgba(74,144,226,.35)); }
  @keyframes whalearc-shine{ 0%{background-position:100% 50%;} 100%{background-position:-100% 50%;} }
  .wt-glow-pro{ border-radius:50%; pointer-events:none;
    background:radial-gradient(ellipse, rgba(56,189,248,.28) 0%, rgba(74,144,226,.12) 40%, transparent 70%);
    animation:wt-glow-pro-pulse 3.5s ease-in-out infinite; }
  @keyframes wt-glow-pro-pulse{ 0%,100%{opacity:.4;transform:scale(.92);} 50%{opacity:1;transform:scale(1.12);} }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
