<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Buddy</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #1b1b1b;
    overflow: hidden;
    font-family: -apple-system, "Segoe UI", sans-serif;
    color: #ddd;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 18px;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #1b1b1b;
    border-radius: 10px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
  }
  .controls { display: flex; gap: 10px; }
  button {
    background: #2c2c2c;
    color: #ddd;
    border: 1px solid #444;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: background .15s;
  }
  button:hover { background: #3a3a3a; }
  button.active { background: #c97b5a; color: #fff; border-color: #c97b5a; }
  .hint { font-size: 12px; color: #777; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="480" height="320"></canvas>
  <div class="controls">
    <button data-mode="idle" class="active">대기</button>
    <button data-mode="walk">걷기</button>
    <button data-mode="jump">점프</button>
  </div>
  <div class="hint">← → 방향키로 직접 움직여보세요 · Space로 점프</div>
</div>

<script>
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

// ── 캐릭터 픽셀 맵 ────────────────────────────────
// 0 = 투명, 1 = 몸통(코랄색), 3 = 눈
// 원본 클로드 코드 캐릭터: 넓적한 몸통 + 가운데 두 눈 + 아래 두 다리
const BODY = '#c97f5d';
const EYE  = '#1b1b1b';
const PAL = { 1: BODY, 3: EYE };

// 다리가 모인 자세 (프레임 A)
const FRAME_A = [
  "001111111100",
  "011111111110",
  "111111111111",
  "111111111111",
  "111001100111",
  "111001100111",
  "111111111111",
  "111111111111",
  "111111111111",
  "011111111110",
  "011111111110",
  "001110011100",
  "001110011100",
];
// 다리가 벌어진 자세 (프레임 B)
const FRAME_B = [
  "001111111100",
  "011111111110",
  "111111111111",
  "111111111111",
  "111001100111",
  "111001100111",
  "111111111111",
  "111111111111",
  "111111111111",
  "011111111110",
  "011111111110",
  "011100001110",
  "011100001110",
];

const PIX = 6;          // 픽셀 한 칸 크기
const CW = 12, CH = 13; // 캐릭터 그리드 크기

function drawChar(map, ox, oy, scale, flip) {
  for (let y = 0; y < map.length; y++) {
    for (let x = 0; x < map[y].length; x++) {
      const c = map[y][x];
      if (c === '0') continue;
      ctx.fillStyle = PAL[c];
      const dx = flip ? (CW - 1 - x) : x;
      ctx.fillRect(ox + dx * scale, oy + y * scale, scale, scale);
    }
  }
}

// ── 상태 ──────────────────────────────────────────
const GROUND = 250;
let buddy = {
  x: cv.width / 2 - (CW * PIX) / 2,
  y: GROUND,
  vy: 0,
  facing: 1,
  onGround: true,
};
let mode = 'idle';
let t = 0;
const keys = {};

// ── 입력 ──────────────────────────────────────────
document.querySelectorAll('button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    mode = b.dataset.mode;
    if (mode === 'jump') jump();
  };
});
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') { jump(); e.preventDefault(); }
});
addEventListener('keyup', e => keys[e.code] = false);

function jump() {
  if (buddy.onGround) { buddy.vy = -9; buddy.onGround = false; }
}

// ── 루프 ──────────────────────────────────────────
function update() {
  t++;
  let moving = false;

  // 방향키 직접 이동
  if (keys['ArrowLeft'])  { buddy.x -= 2.2; buddy.facing = -1; moving = true; }
  if (keys['ArrowRight']) { buddy.x += 2.2; buddy.facing = 1;  moving = true; }

  // 자동 모드: 걷기면 좌우 왕복
  if (mode === 'walk' && !moving) {
    buddy.x += buddy.facing * 1.6;
    moving = true;
    if (buddy.x < 30) buddy.facing = 1;
    if (buddy.x > cv.width - CW * PIX - 30) buddy.facing = -1;
  }

  // 경계
  buddy.x = Math.max(0, Math.min(cv.width - CW * PIX, buddy.x));

  // 중력
  buddy.vy += 0.5;
  buddy.y += buddy.vy;
  if (buddy.y >= GROUND) { buddy.y = GROUND; buddy.vy = 0; buddy.onGround = true; }

  render(moving);
  requestAnimationFrame(update);
}

function render(moving) {
  ctx.clearRect(0, 0, cv.width, cv.height);

  // 바닥
  ctx.fillStyle = '#262626';
  ctx.fillRect(0, GROUND + CH * PIX, cv.width, cv.height);

  // 그림자 (점프하면 작아짐)
  const air = (GROUND - buddy.y) / 60;
  const shW = (CW * PIX) * (1 - air * 0.4);
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.beginPath();
  ctx.ellipse(buddy.x + CW * PIX / 2, GROUND + CH * PIX + 4, shW / 2, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  // 대기 시 위아래로 살짝 둥실
  let bob = 0;
  if (mode === 'idle' && buddy.onGround) bob = Math.sin(t / 22) * 3;

  // 다리 애니메이션: 걷거나 공중이면 프레임 전환
  let frame = FRAME_A;
  if (moving || !buddy.onGround) {
    frame = (Math.floor(t / 8) % 2) ? FRAME_A : FRAME_B;
  }

  // 눈 깜빡임: 가끔 눈 감기
  let map = frame;
  const blink = (t % 200) < 8;
  if (blink) {
    map = frame.map(row => row.replace(/3/g, '1'));
  }

  drawChar(map, buddy.x, buddy.y + bob, PIX, buddy.facing === -1);
}

update();
</script>
</body>
</html>
